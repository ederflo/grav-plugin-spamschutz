enabled: true

# Ab wie vielen Punkten wird abgelehnt. Hoeher = nachsichtiger.
# Bei 6 braucht es drei harmlose Auffaelligkeiten; zu schnell oder zu oft abgeschickt reicht allein.
schwelle: 6

# Sekunden, die das Ausfuellen mindestens dauern muss.
mindestzeit: 4

# Einsendungen je Adresse und Stunde, danach wird abgelehnt.
max_pro_stunde: 8

# Nur einschalten, wenn ein eigener Reverse-Proxy davor sitzt: dann zaehlt X-Forwarded-For.
# Ohne Proxy kann jeder Client den Header faelschen und die Sperre oben umgehen.
proxy_vertrauen: false

# Wie viele Tage das Protokoll (user/data/spamschutz/protokoll.log) aufhebt. 0 = fuer immer.
protokoll_tage: 30

# Sprachpruefung: 2 Punkte, wenn der laengste Text keines dieser Alltagswoerter enthaelt.
# Fuer Seiten in einer anderen Sprache die Liste ersetzen oder sprachpruefung: false setzen.
sprachpruefung: true
alltagswoerter: [der, die, das, und, ist, sind, wir, ich, mit, für, fuer, nicht, ein, eine, einen, bei, auf, von, zu, habe, hallo, servus, guten, gerne, bitte, danke, würde, wuerde, möchte, moechte, können, koennen, anfrage, feuerwehr, verein, sie, ihr, uns, mich, mir, am, im, an, dass, wie, was, oder]

# Text, den ein Mensch sieht, wenn es ihn faelschlich erwischt.
melde_text: 'Deine Nachricht wurde vom Spamschutz abgelehnt. Das tut uns leid, falls du kein Bot bist: schick sie uns bitte direkt per E-Mail, die Adresse steht im Impressum.'

# Je Treffer 2 Punkte (hoechstens 4). Nur Kleinbuchstaben, wird als Teilwort gesucht.
begriffe:
  - 'quería saber tu precio'
  - 'saber tu precio'
  - 'your price'
  - 'know your price'
  - 'price list'
  - 'backlink'
  - 'guest post'
  - 'seo service'
  - 'seo-service'
  - 'search engine optimization'
  - 'web design service'
